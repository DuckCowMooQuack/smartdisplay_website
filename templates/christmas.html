<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020609">
  <title>{{ scene_title }} — ASCII Christmas</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #020609; }
    canvas { display: block; width: 100%; height: 100%; }
    #controls { position: fixed; bottom: 20px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; opacity: 0; transition: opacity .3s; pointer-events: none; }
    #controls.visible, #controls:focus-within { opacity: 1; pointer-events: auto; }
    button, a, select { font: 16px monospace; color: #e2e8df; background: #071114ed; border: 1px solid #70827a; border-radius: 6px; padding: 12px 18px; text-decoration: none; cursor: pointer; max-width: 100%; }
    button:focus-visible, a:focus-visible { outline: 2px solid #ffe1a0; }
    #still { position: absolute; top: 40%; width: 100%; color: #d1e1db; text-align: center; font: 20px monospace; }
  </style>
</head>
<body data-scene="{{ scene_name }}">
  <canvas id="winter" role="img" aria-label="{{ scene_description }}"></canvas>
  <noscript><p id="still">Enable JavaScript to see the winter forest.</p></noscript>
  <nav id="controls" aria-label="Scene controls">
    <button id="pause" type="button">Pause</button>
    <a href="/" id="back">Photos</a>
    <select id="scene-picker" aria-label="Preview scene" hidden>
      {% for key, info in scenes.items() %}
      <option value="{{ key }}" {% if key == scene_name %}selected{% endif %}>{{ info[0] }}</option>
      {% endfor %}
    </select>
  </nav>
  <script>
    if (window.parent === window) {
      var picker = document.getElementById('scene-picker');
      picker.hidden = false;
      picker.onchange = function () { window.location.href = '/scenes/' + this.value; };
    }
  </script>
  <script src="{{ url_for('static', filename=scene_script, v='christmas-5') }}"></script>
</body>
</html>
