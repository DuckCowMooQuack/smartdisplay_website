<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="refresh" content="{{ refresh_seconds }}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Smart Display</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #000;
      font-family: sans-serif;
      color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.45) 0%,
        rgba(0, 0, 0, 0.12) 35%,
        rgba(0, 0, 0, 0.45) 100%
      );
      z-index: 0;
      pointer-events: none;
    }

    #photo-underlay-2,
    #photo-underlay-1,
    #photo-layer {
      position: absolute;
      top: 3.8vh;
      right: 3.6vw;
      bottom: 3.8vh;
      left: 3.6vw;
      background-color: transparent;
      background-repeat: no-repeat;
      background-position: center center;
      background-size: contain;
      transform-origin: center center;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      border: 0;
      border-radius: 4px;
      opacity: 1;
    }

    #photo-underlay-2 {
      z-index: -3;
      opacity: 0.34;
      transform: translate(-4.2vw, 2.1vh) rotate(-7deg) scale(0.955);
    }

    #photo-underlay-1 {
      z-index: -2;
      opacity: 0.52;
      transform: translate(3.6vw, -1.7vh) rotate(6deg) scale(0.972);
    }

    #photo-layer {
      z-index: -1;
      opacity: 1;
      transform: none;
    }

    body[data-transition-mode="none"] #photo-underlay-2,
    body[data-transition-mode="none"] #photo-underlay-1 {
      display: none;
    }

    body[data-transition-mode="none"] #photo-layer {
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      border-radius: 0;
      border: 0;
      box-shadow: none;
      background-color: transparent;
      opacity: 1;
      transform: none !important;
    }

    body[data-text-theme="dark"] {
      color: #121212;
      text-shadow: 0 1px 4px rgba(255, 255, 255, 0.8);
    }

    body[data-text-theme="dark"]::before {
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 255, 255, 0.12) 35%,
        rgba(255, 255, 255, 0.45) 100%
      );
    }

    .overlay-wrap,
    .filename-wrap {
      position: absolute;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
    }

    .overlay-wrap {
      top: 12px;
    }

    .filename-wrap {
      bottom: 10px;
    }

    .overlay {
      width: calc(100% - 24px);
      max-width: 720px;
      text-align: center;
      font-size: 1.3em;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-sizing: border-box;
    }

    body[data-text-theme="dark"] .overlay {
      background: rgba(255, 255, 255, 0.44);
      border-color: rgba(0, 0, 0, 0.24);
    }

    #clock {
      font-size: 1.2em;
      margin-top: 4px;
      letter-spacing: 0.03em;
    }

    .filename {
      width: calc(100% - 24px);
      max-width: 720px;
      text-align: center;
      font-size: 0.75em;
      color: rgba(255, 255, 255, 0.22);
      opacity: 0.22;
      padding: 7px 10px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-sizing: border-box;
      transition: opacity 0.2s ease, color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    body[data-text-theme="dark"] .filename {
      color: rgba(0, 0, 0, 0.25);
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(0, 0, 0, 0.12);
    }

    body[data-show-filename="1"] .filename {
      opacity: 0.92;
      color: rgba(255, 255, 255, 0.82);
      background: rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.2);
    }

    body[data-text-theme="dark"][data-show-filename="1"] .filename {
      color: rgba(0, 0, 0, 0.85);
      background: rgba(255, 255, 255, 0.38);
      border-color: rgba(0, 0, 0, 0.22);
    }

    @media (orientation: portrait) {
      .overlay {
        font-size: 1.45em;
      }

      .filename {
        font-size: 0.85em;
      }
    }

    @media (orientation: landscape) {
      .overlay {
        font-size: 1.1em;
        max-width: 65vw;
      }

      .filename {
        max-width: 65vw;
      }
    }
  </style>
</head>
<body
  data-text-theme="light"
  data-show-filename="0"
  data-layout-mode="{{ layout_mode }}"
  data-transition-mode="{{ transition_mode }}"
>
  <div id="photo-underlay-2"></div>
  <div id="photo-underlay-1"></div>
  <div id="photo-layer"></div>

  <div class="overlay-wrap">
    <div class="overlay">
      <div>{{ formatted_date }}</div>
      <div>{{ temp }}°{{ temp_unit }} - {{ description }}</div>
      <div id="clock">Loading...</div>
    </div>
  </div>

  <div class="filename-wrap">
    <div class="filename">
      {{ image_name if image_name else "No image available" }}
    </div>
  </div>

  <script>
    function updateClock() {
      var now = new Date();
      var hours = now.getHours();
      var minutes = now.getMinutes();
      var seconds = now.getSeconds();
      var ampm = hours >= 12 ? 'PM' : 'AM';

      hours = hours % 12;
      hours = hours ? hours : 12;

      function pad(n) { return (n < 10 ? '0' : '') + n; }
      var str = hours + ':' + pad(minutes) + ':' + pad(seconds) + ' ' + ampm;
      document.getElementById('clock').innerHTML = str;
    }

    function setTextTheme(theme) {
      document.body.setAttribute('data-text-theme', theme);
    }

    function sampleImageBrightness(imageUrl, callback) {
      var img = new Image();

      img.onload = function () {
        try {
          var sampleSize = 24;
          var canvas = document.createElement('canvas');
          canvas.width = sampleSize;
          canvas.height = sampleSize;

          var ctx = canvas.getContext('2d');
          if (!ctx) {
            callback(null);
            return;
          }

          ctx.drawImage(img, 0, 0, sampleSize, sampleSize);
          var pixels = ctx.getImageData(0, 0, sampleSize, sampleSize).data;
          var total = 0;
          var count = 0;

          for (var i = 0; i < pixels.length; i += 4) {
            var alpha = pixels[i + 3];
            if (alpha === 0) {
              continue;
            }

            var red = pixels[i];
            var green = pixels[i + 1];
            var blue = pixels[i + 2];
            total += (red * 299 + green * 587 + blue * 114) / 1000;
            count += 1;
          }

          if (!count) {
            callback(null);
            return;
          }

          callback(total / count);
        } catch (err) {
          callback(null);
        }
      };

      img.onerror = function () {
        callback(null);
      };

      img.src = imageUrl;
    }

    function applyThemeFromImage(imageUrl) {
      if (!imageUrl) {
        setTextTheme('light');
        return;
      }

      sampleImageBrightness(imageUrl, function (brightness) {
        if (brightness === null) {
          setTextTheme('light');
          return;
        }

        if (brightness >= 150) {
          setTextTheme('dark');
        } else {
          setTextTheme('light');
        }
      });
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function setPhotoLayerImage(element, imageUrl) {
      if (!element) {
        return;
      }

      if (imageUrl) {
        element.style.backgroundImage = 'url("' + imageUrl + '")';
      } else {
        element.style.backgroundImage = 'none';
      }
    }

    function getStoredImageHistory(storageKey) {
      try {
        var raw = window.localStorage.getItem(storageKey);
        if (!raw) {
          return [];
        }

        var parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) {
          return [];
        }

        var cleaned = [];
        for (var i = 0; i < parsed.length; i += 1) {
          if (typeof parsed[i] === 'string' && parsed[i].length > 0) {
            cleaned.push(parsed[i]);
          }
        }
        return cleaned;
      } catch (err) {
        return [];
      }
    }

    function setStoredImageHistory(storageKey, history) {
      try {
        window.localStorage.setItem(storageKey, JSON.stringify(history));
      } catch (err) {
        // Ignore storage failures on older browsers.
      }
    }

    function initializePhotoLayers(currentImageUrl) {
      var photoUnderlay2 = document.getElementById('photo-underlay-2');
      var photoUnderlay1 = document.getElementById('photo-underlay-1');
      var photoLayer = document.getElementById('photo-layer');
      var storageKey = 'smartdisplay_image_history';
      var history = getStoredImageHistory(storageKey);
      var previousImageUrl = null;
      var secondPreviousImageUrl = null;
      var i;

      for (i = 0; i < history.length; i += 1) {
        if (!previousImageUrl && history[i] !== currentImageUrl) {
          previousImageUrl = history[i];
          continue;
        }
        if (previousImageUrl && !secondPreviousImageUrl && history[i] !== currentImageUrl && history[i] !== previousImageUrl) {
          secondPreviousImageUrl = history[i];
          break;
        }
      }

      if (!currentImageUrl) {
        setPhotoLayerImage(photoUnderlay1, previousImageUrl);
        setPhotoLayerImage(photoUnderlay2, secondPreviousImageUrl || previousImageUrl);
        setPhotoLayerImage(photoLayer, null);
        return { hasCurrentImage: false, hasPreviousImage: Boolean(previousImageUrl) };
      }

      setPhotoLayerImage(photoUnderlay1, previousImageUrl || currentImageUrl);
      setPhotoLayerImage(photoUnderlay2, secondPreviousImageUrl || previousImageUrl || currentImageUrl);
      setPhotoLayerImage(photoLayer, currentImageUrl);

      var nextHistory = [currentImageUrl];
      for (i = 0; i < history.length; i += 1) {
        if (history[i] !== currentImageUrl) {
          nextHistory.push(history[i]);
        }
        if (nextHistory.length >= 4) {
          break;
        }
      }
      setStoredImageHistory(storageKey, nextHistory);

      return { hasCurrentImage: true, hasPreviousImage: Boolean(previousImageUrl) };
    }

    function runPostcardDropTransition(imageUrl) {
      var photoLayer = document.getElementById('photo-layer');
      if (!photoLayer || !imageUrl) {
        return;
      }

      var screenWidth = window.innerWidth || 800;
      var screenHeight = window.innerHeight || 1280;
      var startX = randomInt(Math.round(-0.16 * screenWidth), Math.round(0.16 * screenWidth));
      var endX = randomInt(Math.round(-0.06 * screenWidth), Math.round(0.06 * screenWidth));
      var startY = randomInt(Math.round(-0.32 * screenHeight), Math.round(-0.2 * screenHeight));
      var startRotate = randomInt(-10, 10);
      var settleRotate = randomInt(-8, 8);
      var endScale = randomInt(94, 98) / 100;
      var durationMs = randomInt(1200, 1700);

      photoLayer.style.transition = 'none';
      photoLayer.style.opacity = '0';
      photoLayer.style.boxShadow = '0 14px 34px rgba(0, 0, 0, 0.55)';
      photoLayer.style.transform =
        'translate(' + startX + 'px, ' + startY + 'px) rotate(' + startRotate + 'deg) scale(0.9)';

      void photoLayer.offsetWidth;

      setTimeout(function () {
        photoLayer.style.transition =
          'transform ' + durationMs + 'ms cubic-bezier(0.12, 0.79, 0.2, 1), ' +
          'opacity 420ms ease-out, box-shadow ' + durationMs + 'ms ease-out';
        photoLayer.style.opacity = '1';
        photoLayer.style.boxShadow = '0 4px 12px rgba(0, 0, 0, 0.3)';
        photoLayer.style.transform =
          'translate(' + endX + 'px, 0px) rotate(' + settleRotate + 'deg) scale(' + endScale + ')';
      }, 35);
    }

    function runPostcardTopdownTransition(imageUrl) {
      var photoLayer = document.getElementById('photo-layer');
      if (!photoLayer || !imageUrl) {
        return;
      }

      var screenWidth = window.innerWidth || 800;
      var screenHeight = window.innerHeight || 1280;
      var startX = randomInt(Math.round(-0.05 * screenWidth), Math.round(0.05 * screenWidth));
      var endX = randomInt(Math.round(-0.05 * screenWidth), Math.round(0.05 * screenWidth));
      var startY = randomInt(Math.round(-0.03 * screenHeight), Math.round(0.03 * screenHeight));
      var startScale = randomInt(112, 126) / 100;
      var endRotate = randomInt(-8, 8);
      var startRotate = endRotate + randomInt(-6, 6);
      var endScale = randomInt(95, 99) / 100;
      var durationMs = randomInt(950, 1450);

      photoLayer.style.transition = 'none';
      photoLayer.style.opacity = '0';
      photoLayer.style.boxShadow = '0 30px 58px rgba(0, 0, 0, 0.55)';
      photoLayer.style.transform =
        'translate(' + startX + 'px, ' + startY + 'px) rotate(' + startRotate + 'deg) scale(' + startScale + ')';

      void photoLayer.offsetWidth;

      setTimeout(function () {
        photoLayer.style.transition =
          'transform ' + durationMs + 'ms cubic-bezier(0.16, 0.78, 0.2, 1), ' +
          'opacity 360ms ease-out, box-shadow ' + durationMs + 'ms ease-out';
        photoLayer.style.opacity = '1';
        photoLayer.style.boxShadow = '0 4px 10px rgba(0, 0, 0, 0.28)';
        photoLayer.style.transform =
          'translate(' + endX + 'px, 0px) rotate(' + endRotate + 'deg) scale(' + endScale + ')';
      }, 35);
    }

    var filenameTimer = null;

    function showFilenameTemporarily() {
      document.body.setAttribute('data-show-filename', '1');
      if (filenameTimer) {
        clearTimeout(filenameTimer);
      }
      filenameTimer = setTimeout(function () {
        document.body.setAttribute('data-show-filename', '0');
        filenameTimer = null;
      }, 8000);
    }

    setInterval(updateClock, 1000);
    updateClock();

    var currentImageUrl = {{ image_url | tojson }};
    var transitionMode = {{ transition_mode | tojson }};
    var photoState = initializePhotoLayers(currentImageUrl);

    applyThemeFromImage(currentImageUrl);
    if (transitionMode === 'postcard_drop' && photoState.hasCurrentImage) {
      runPostcardDropTransition(currentImageUrl);
    } else if (transitionMode === 'postcard_drop_topdown' && photoState.hasCurrentImage) {
      runPostcardTopdownTransition(currentImageUrl);
    }

    document.body.addEventListener('click', showFilenameTemporarily, false);
    document.body.addEventListener('touchstart', showFilenameTemporarily, false);
  </script>
</body>
</html>
