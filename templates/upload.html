<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Display Upload</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: sans-serif;
      background: #0f1013;
      color: #f3f4f6;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 12px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: #1b1f27;
      border: 1px solid #313a49;
      border-radius: 14px;
      padding: 18px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.2rem;
    }

    .hint {
      margin: 0 0 14px;
      font-size: 0.92rem;
      color: #c9d2df;
      line-height: 1.4;
    }

    .status {
      margin-bottom: 12px;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .status-info {
      background: #242c3a;
      border: 1px solid #35435a;
      color: #dbe8ff;
    }

    .status-success {
      background: #1f3a2f;
      border: 1px solid #2f604c;
      color: #ddf5ea;
    }

    .status-error {
      background: #4a1f24;
      border: 1px solid #7c343f;
      color: #ffe5e8;
    }

    .status-warning {
      background: #433114;
      border: 1px solid #71531e;
      color: #fff1d2;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      font-size: 0.9rem;
      color: #d4d9e2;
    }

    input[type="file"] {
      background: #12151b;
      color: #f3f4f6;
      border: 1px solid #364152;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.95rem;
    }

    button {
      margin-top: 4px;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 1rem;
      background: #2c7eea;
      color: #fff;
      cursor: pointer;
    }

    button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Smart Display Upload</h1>
    <p class="hint">
      Allowed types: {{ allowed_extensions }}<br>
      Max total upload size per request: {{ max_upload_mb }} MB
    </p>

    {% if status_message %}
      <div class="status status-{{ status_level }}">{{ status_message }}</div>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
      <input type="hidden" name="token" value="{{ token }}">
      <label for="photos">Choose one or more photos</label>
      <input
        id="photos"
        name="photos"
        type="file"
        accept=".jpg,.jpeg,.png,.webp,image/*"
        multiple
        required
      >
      <button type="submit">Upload Photos</button>
    </form>
  </div>
</body>
</html>
